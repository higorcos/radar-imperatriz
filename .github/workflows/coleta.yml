# Coleta de notícias a cada hora, chamando a rota protegida do app publicado.
# Configure em Settings → Secrets and variables → Actions:
#   APP_URL      ex.: https://radar-imperatriz.vercel.app (sem barra no final)
#   CRON_SECRET  o mesmo valor definido nas variáveis da Vercel
name: Coleta de notícias

on:
  schedule:
    - cron: "17 * * * *" # a cada hora, no minuto 17 (o GitHub pode atrasar alguns minutos)
  workflow_dispatch: {} # permite rodar manualmente na aba Actions

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar /api/cron/collect
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Defina os secrets APP_URL e CRON_SECRET." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 180 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/collect"
